# pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greetlab-25020007154"
version = "0.1.0"

[project.scripts]
sdt-greet = "greetlab.cli:main"
[tool.ruff]
line-length = 120
select = ["E", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

